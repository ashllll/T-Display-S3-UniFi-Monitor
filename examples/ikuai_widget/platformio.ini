; LILYGO T-Display-S3 - UniFi Network 监控
; ESP32-S3R8, ST7789 170x320 i80 并口 LCD, 16MB Flash + 8MB OPI PSRAM

[platformio]
default_envs = t-display-s3
boards_dir = ../../boards

[env:t-display-s3]
platform = espressif32@6.7.0
board = lilygo-t-display-s3
framework = espidf

; LVGL 9 is resolved through idf_component.yml. Keep this project isolated
; from the repository's legacy Arduino/LVGL 8 examples while targeting the
; exact T-Display-S3 board definition from ../../boards.
build_flags =
    -Icomponents
    -DLV_CONF_PATH=lv_conf.h
    -DAPP_DEMO_MODE=0
    -DAPP_REQUIRE_LIVE_MODE=1

; 16MB Flash，app 分区 3MB
board_build.partitions = partitions.csv

; Upload & Monitor（按实际端口修改）
upload_speed = 921600
monitor_speed = 115200
;upload_port = /dev/cu.usbmodemxxxx
;monitor_port = /dev/cu.usbmodemxxxx
